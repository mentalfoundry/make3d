<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make3d</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 9.5v13L16 29 4 22.5v-13z' fill='%23c2662d'/%3E%3Cpath d='M16 3 28 9.5 16 16 4 9.5z' fill='%23e8955c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <h1><span class="logo"></span>make3d</h1>
    <label>Password<input type="password" id="login-pw" autocomplete="current-password" autofocus required></label>
    <button class="primary" type="submit">Log in</button>
    <p class="error" id="login-err"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <a class="brand" href="#3d"><span class="logo"></span>make3d</a>
    <nav id="nav">
      <a href="#3d">3D</a>
      <a href="#art">Art to 3D</a>
      <a href="#video">Video</a>
      <a href="#sound">Sound</a>
      <a href="#story">Storyboard</a>
      <a href="#jobs">Jobs <span id="jobs-badge" class="badge" hidden></span></a>
      <a href="#library">Library</a>
      <a href="#settings">Settings <span id="lemon-dot" class="dot" title="Lemonade"></span></a>
    </nav>
    <button id="logout" class="ghost small">Log out</button>
  </header>
  <main id="main"></main>
</div>
<script src="static/app.js"></script>
</body>
</html>
